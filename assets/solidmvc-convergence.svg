      <rect x="290" y="503" width="334" height="26" rx="6" fill="url(#rowConv)"/><use href="#tick" transform="translate(300 511) scale(1.15)"/><text x="320" y="522">Modules + dependency injection</text>
      <rect x="290" y="531" width="334" height="26" rx="6" fill="url(#rowConv)"/><use href="#tick" transform="translate(300 539) scale(1.15)"/><text x="320" y="550">MVC controllers &amp; lifecycle</text>
