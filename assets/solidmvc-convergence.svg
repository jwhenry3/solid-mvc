      <rect x="660" y="305" width="460" height="26" rx="6" fill="url(#rowNeg)"/><use href="#cross" transform="translate(671 314) scale(1.1)"/><text x="690" y="324">No DI or module boundaries</text>
      <rect x="660" y="333" width="460" height="26" rx="6" fill="url(#rowNeg)"/><use href="#cross" transform="translate(671 342) scale(1.1)"/><text x="690" y="352">Structure drifts as apps scale</text>
    </g>
