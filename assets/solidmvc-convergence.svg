      <rect x="642" y="531" width="346" height="26" rx="6" fill="url(#rowConv)"/><use href="#tick" transform="translate(652 539) scale(1.15)"/><text x="672" y="550">Class views + function components</text>
      <rect x="642" y="559" width="346" height="26" rx="6" fill="url(#rowConv)"/><use href="#tick" transform="translate(652 567) scale(1.15)"/><text x="672" y="578">smvc CLI</text>
