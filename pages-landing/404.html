<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolidMVC — page not found</title>
    <meta name="color-scheme" content="dark light" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff; --text: #444444; --heading: #000000; --muted: #777777;
        --accent: #2c4f7c; --code-bg: #f4f4f4; --code-border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #242424; --text: #cccccc; --heading: #ffffff; --muted: #999999;
          --accent: #76b3e1; --code-bg: #1c2027; --code-border: #3f3f3f;
        }
      }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      main { text-align: center; max-width: 480px; padding: 24px; }
      h1 { font-size: 2rem; margin-bottom: 8px; color: var(--heading); }
      p { color: var(--muted); line-height: 1.6; }
      a { color: var(--accent); }
      code { background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 1px 6px; font-size: .9em; color: var(--text); }
    </style>
    <script>
      // SPA deep-link shim: a miss under /docs/<app>/<rest> is probably a
      // client-side route of a mounted app (demo, enterprise, docs site
      // routes are real files and never reach here). Redirect into the
      // app with the path in a query param — its router restores it via
      // replaceState on boot. Only rest>'' redirects: a bare app dir
      // serves its own index.html, and a truly missing app lands back on
      // this page instead of looping.
      var p = location.pathname;
      var m = p.match(/^(\/docs\/[^/]+\/)(.+)$/);
      if (m) {
        location.replace(
          m[1] + '?__smvc_path=' + encodeURIComponent(m[2] + location.search + location.hash)
        );
      } else {
        // The docs site lives at <root>/docs/<route>/. A miss one level under
        // the docs root is probably a stale deep link — offer the docs home.
        var docsIdx = p.indexOf('/docs/');
        var docsHome = docsIdx >= 0 ? p.slice(0, docsIdx + 6) : './docs/';
        var home = docsIdx >= 0 ? p.slice(0, docsIdx + 1) : './';
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('docs-home').href = docsHome;
          document.getElementById('site-home').href = home;
          document.getElementById('path').textContent = p;
        });
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><code id="path"></code> doesn't exist in this site.</p>
      <p>
        <a id="docs-home" href="./docs/">Browse the documentation</a>&nbsp;·&nbsp;
        <a id="site-home" href="./">Back to the homepage</a>
      </p>
    </main>
  </body>
</html>
